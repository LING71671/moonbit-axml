name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native_cli: _build/native/debug/build/cmd/axml-native/axml-native.exe
          - os: windows-latest
            native_cli: _build/native/debug/build/cmd/axml-native/axml-native.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1
        with:
          version: '0.10.18+6c83a7f62'
          core-version: '0.10.18+6c83a7f62'
      - name: Check formatting
        run: moon fmt --check
      - name: Generate public interfaces
        run: moon info
      - name: Verify committed public interfaces
        run: git diff --exit-code -- src
      - name: Check every backend
        run: moon check --target all --deny-warn
      - name: Test wasm-gc
        run: moon test --target wasm-gc --deny-warn
      - name: Test JavaScript
        run: moon test --target js --deny-warn
      - name: Test native
        run: moon test --target native --deny-warn
      - name: Build JavaScript CLI
        run: moon build src/cmd/axml --target js --deny-warn
      - name: Verify JavaScript CLI against independent references
        run: python scripts/verify_cli.py --cli node _build/js/debug/build/cmd/axml/axml.js
      - name: Build native CLI
        run: moon build src/cmd/axml-native --target native --deny-warn
      - name: Verify native CLI against independent references
        run: python scripts/verify_cli.py --cli ${{ matrix.native_cli }}
      - name: Verify bounded stress cases on both CLI hosts
        run: python scripts/benchmark.py --repeats 1 --warmup 0 --output _build/benchmarks/ci.json
